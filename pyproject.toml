[project]
name = "mylilpwny"
version = "0.1.0"
description = "Autonomous pentest and bug bounty friend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "pyyaml>=6",
    "structlog>=24",
    "httpx>=0.27",
    "dnspython>=2.8.0",
    "python-whois>=0.9.6",
    "ipwhois>=1.3.0",
    "pymetasploit3>=1.0.6",
    "sqlalchemy>=2.0",
]

[project.scripts]
mylilpwny = "mylilpwny.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
